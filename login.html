<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Metalabs</title>
    <style>
        :root {
            --bg-main: #070913;
            --card-bg: #0b0d19;
            --neon-purple: #8b5cf6;
            --text-main: #f7f8fc;
            --text-muted: #a0a7b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .login-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header-text { text-align: center; margin-bottom: 30px; }
        .header-text h1 { font-size: 28px; margin-bottom: 10px; color: var(--neon-purple); }
        .header-text p { color: var(--text-muted); font-size: 14px; }

        .google-btn {
            width: 100%; background: transparent; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 8px; font-weight: 600;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-bottom: 25px; transition: 0.3s;
        }
        .google-btn:hover { background: rgba(255,255,255,0.05); }

        .divider {
            display: flex; align-items: center; text-align: center; color: var(--text-muted);
            font-size: 12px; margin-bottom: 25px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-main); margin-bottom: 8px; font-weight: 600; }
        
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%; padding: 14px 14px 14px 40px; background: transparent;
            border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
            outline: none; transition: 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--neon-purple); }
        .input-wrapper svg {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); width: 16px; height: 16px;
        }

        .submit-btn {
            width: 100%; background: var(--neon-purple); color: white; border: none;
            padding: 14px; border-radius: 8px; font-weight: 600; font-size: 16px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { background: #7c3aed; }

        .switch-link {
            text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-muted);
        }
        .switch-link a { color: var(--text-main); text-decoration: none; font-weight: 600; cursor: pointer; }
        .switch-link a:hover { text-decoration: underline; }
        
        #form-message { text-align: center; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-text">
            <h1 id="title-text">Welcome Back</h1>
            <p id="subtitle-text">Sign in to your GenMeta account</p>
        </div>

        <button class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 15.02 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </button>

        <div class="divider">OR CONTINUE WITH EMAIL</div>

        <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="email" id="user-email" placeholder="Enter your email">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="user-password" placeholder="Enter your password">
            </div>
        </div>

        <button class="submit-btn" id="action-btn">Sign In →</button>
        <div id="form-message"></div>

        <div class="switch-link">
            <span id="switch-text">Don't have an account?</span> 
            <a id="switch-action">Create account</a>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        
        const titleText = document.getElementById('title-text');
        const subtitleText = document.getElementById('subtitle-text');
        const actionBtn = document.getElementById('action-btn');
        const switchText = document.getElementById('switch-text');
        const switchAction = document.getElementById('switch-action');
        const emailInput = document.getElementById('user-email');
        const passwordInput = document.getElementById('user-password');
        const formMsg = document.getElementById('form-message');

        switchAction.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                titleText.textContent = "Welcome Back";
                subtitleText.textContent = "Sign in to your GenMeta account";
                actionBtn.textContent = "Sign In →";
                switchText.textContent = "Don't have an account?";
                switchAction.textContent = "Create account";
            } else {
                titleText.textContent = "Create Account";
                subtitleText.textContent = "Register to get 50 free credits";
                actionBtn.textContent = "Sign Up →";
                switchText.textContent = "Already have an account?";
                switchAction.textContent = "Sign in";
            }
            formMsg.textContent = "";
        });

        actionBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if(!email || !password) {
                formMsg.style.color = '#ff6d78';
                formMsg.textContent = 'Please enter both email and password.';
                return;
            }

            formMsg.style.color = 'var(--text-muted)';
            formMsg.textContent = 'Processing... Please wait.';
            actionBtn.disabled = true;

            const endpoint = isLoginMode ? '/api/v1/users/app/login' : '/api/v1/users/app/register';

            try {
                const response = await fetch(`https://genmeta-server.onrender.com${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    formMsg.style.color = '#70e3a1';
                    formMsg.textContent = isLoginMode ? 'Login successful! Opening App...' : 'Account created! Opening App...';
                    
                    localStorage.setItem('metalabs_email', email);
                    if(!isLoginMode) {
                        localStorage.setItem('metalabs_credits', '50');
                        localStorage.setItem('metalabs_plan', 'free');
                    }

                    const secretKey = data.data.apiKey;
                    window.location.href = `genmeta://login?token=${secretKey}`;
                    
                    setTimeout(() => { window.location.href = "index.html"; }, 2000);
                } else {
                    formMsg.style.color = '#ff6d78';
                    formMsg.textContent = 'Error: ' + (data.message || 'Authentication failed');
                }
            } catch (error) {
                formMsg.style.color = '#ff6d78';
                formMsg.textContent = 'Server connection failed.';
            } finally {
                actionBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
